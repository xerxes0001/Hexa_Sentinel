  <text x="457" y="433" text-anchor="middle" font-size="8" fill="#8BA8C8">Process Boundary: UI → localhost (127.0.0.1) only · Zero outbound cloud telemetry · Silicon Boundary: Models run exclusively in Hexagon NPU memory</text>
  <text x="457" y="447" text-anchor="middle" font-size="8" fill="#8BA8C8">Privacy-by-Design: Raw payload discarded at Stage 1 ingestion · DPDP Act 2023 compliant · Energy: 0.015 Wh/incident</text>

