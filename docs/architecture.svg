  <text x="718" y="254" font-size="8" fill="#6A8BAA">• Voice Query (Whisper NPU)</text>

  <rect x="718" y="273" width="145" height="28" rx="6" fill="rgba(16,185,129,0.08)" stroke="#10B981" stroke-width="0.8"/>
  <text x="790" y="288" text-anchor="middle" font-size="8" fill="#34D399" font-weight="600">DELIVERY: &lt; 50ms local</text>
  <text x="790" y="300" text-anchor="middle" font-size="7.5" fill="#6A8BAA">Localhost WebSocket push</text>

  <rect x="718" y="308" width="145" height="50" rx="6" fill="rgba(16,185,129,0.06)" stroke="#10B981" stroke-width="0.8" opacity="0.7"/>
  <text x="790" y="322" text-anchor="middle" font-size="8" fill="#8BA8C8" font-weight="600">NPU Status Badge</text>
  <text x="790" y="334" text-anchor="middle" font-size="7" fill="#4F6A88">QNN LIVE / CPU / SIMULATION</text>
  <text x="790" y="348" text-anchor="middle" font-size="7" fill="#4F6A88">Polls /api/health every 10s</text>

