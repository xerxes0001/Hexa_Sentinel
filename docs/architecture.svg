  <text x="567" y="252" text-anchor="middle" font-size="7.5" fill="#6A8BAA">Buffer purged · 0% CPU/NPU waste</text>
  <rect x="475" y="268" width="185" height="40" rx="6" fill="rgba(244,63,94,0.08)" stroke="#F43F5E" stroke-width="0.8"/>
  <text x="567" y="284" text-anchor="middle" font-size="8" fill="#F43F5E" font-weight="600">S ≥ 0.85 → Threat Branch</text>
