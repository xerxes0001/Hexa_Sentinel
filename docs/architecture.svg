  <text x="107" y="323" text-anchor="middle" font-size="7.5" fill="#8BA8C8">Host NIC / CPU — HARDWARE</text>
  <text x="107" y="335" text-anchor="middle" font-size="7" fill="#4F6A88">LATENCY: ZERO (ring buffer)</text>

  <!-- arrow 1→2 -->
  <line x1="215" y1="230" x2="240" y2="230" stroke="#0CD4F5" stroke-width="1.5" marker-end="url(#arr)" opacity="0.7"/>

