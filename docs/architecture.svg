  <text x="995" y="148" text-anchor="middle" font-size="26" font-weight="800" fill="#0CD4F5">45</text>
  <text x="995" y="163" text-anchor="middle" font-size="8" fill="#0CD4F5" font-weight="600">TOPS</text>
  <text x="995" y="176" text-anchor="middle" font-size="7" fill="#4F6A88">Hexagon NPU</text>

  <line x1="925" y1="185" x2="1065" y2="185" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="995" y="212" text-anchor="middle" font-size="26" font-weight="800" fill="#F43F5E">&lt;3</text>
  <text x="995" y="227" text-anchor="middle" font-size="8" fill="#F43F5E" font-weight="600">ms</text>
  <text x="995" y="240" text-anchor="middle" font-size="7" fill="#4F6A88">ONNX inference</text>

  <line x1="925" y1="250" x2="1065" y2="250" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="995" y="276" text-anchor="middle" font-size="26" font-weight="800" fill="#10B981">0</text>
  <text x="995" y="291" text-anchor="middle" font-size="8" fill="#10B981" font-weight="600">BYTES</text>
  <text x="995" y="304" text-anchor="middle" font-size="7" fill="#4F6A88">cloud egress</text>

  <line x1="925" y1="314" x2="1065" y2="314" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="995" y="340" text-anchor="middle" font-size="22" font-weight="800" fill="#F59E0B">3–5W</text>
  <text x="995" y="355" text-anchor="middle" font-size="7.5" fill="#F59E0B" font-weight="600">POWER</text>
  <text x="995" y="368" text-anchor="middle" font-size="7" fill="#4F6A88">vs 15-20W CPU</text>
