  <!-- Background -->
  <rect width="1100" height="480" fill="#07101E" rx="12"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#EAF2FF" letter-spacing="-0.5">HexaSentinel — End-to-End Silicon-Native Dataflow</text>
  <text x="550" y="55" text-anchor="middle" font-size="10" fill="#4F6A88" letter-spacing="0.5">QUALCOMM SNAPDRAGON AI LAB CHALLENGE 2026</text>

  <!-- ── COLUMN 1: INGESTION LAYER ── -->
  <rect x="20" y="75" width="195" height="310" rx="10" fill="url(#gCyan)" stroke="#0CD4F5" stroke-width="1.2"/>
  <rect x="20" y="75" width="195" height="30" rx="10" fill="#0CD4F5" opacity="0.18"/>
  <text x="117" y="95" text-anchor="middle" font-size="9" font-weight="700" fill="#0CD4F5" letter-spacing="1">INGESTION LAYER</text>
  <text x="117" y="108" text-anchor="middle" font-size="8" fill="#4F6A88">Network Adapters</text>

  <text x="117" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#EAF2FF">Stage 1</text>
  <text x="117" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#0CD4F5">Passive Ingestion</text>
  <text x="117" y="172" text-anchor="middle" font-size="8.5" fill="#8BA8C8">Scapy / WinPcap Hook</text>
  <text x="40" y="198" font-size="8" fill="#6A8BAA">• Rolling 30s in-memory ring</text>
  <text x="40" y="212" font-size="8" fill="#6A8BAA">• Strips payload immediately</text>
  <text x="40" y="226" font-size="8" fill="#6A8BAA">• Zero disk persistence</text>
