  <text x="337" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#EAF2FF">Stage 2</text>
  <text x="337" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#A78BFA">Feature Extraction</text>
  <text x="337" y="172" text-anchor="middle" font-size="8.5" fill="#8BA8C8">80-Feature Vector Engine</text>
  <text x="258" y="198" font-size="8" fill="#6A8BAA">• Shannon port entropy index</text>
  <text x="258" y="212" font-size="8" fill="#6A8BAA">• Inter-arrival packet jitter</text>
  <text x="258" y="226" font-size="8" fill="#6A8BAA">• SYN/ACK ratio asymmetry</text>
  <text x="258" y="240" font-size="8" fill="#6A8BAA">• Flow byte distribution stats</text>
  <rect x="258" y="265" width="145" height="28" rx="6" fill="rgba(139,92,246,0.08)" stroke="#8B5CF6" stroke-width="0.8"/>
  <text x="330" y="280" text-anchor="middle" font-size="8" fill="#A78BFA" font-weight="600">Localhost WebSocket</text>
